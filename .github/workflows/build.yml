name: Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Setup MSVC (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Download Steamworks SDK (CI build)
      shell: pwsh
      run: |
        $sdkUrl = "https://github.com/julianxhokaxhiu/SteamworksSDKCI/archive/refs/tags/1.64.zip"
        $sdkZip = "${{ github.workspace }}/steamworks_sdk_ci.zip"
        $sdkTmp = "${{ github.workspace }}/steamworks_sdk_tmp"
        $dest   = "${{ github.workspace }}/steamworks/sdk"

        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip
        Expand-Archive -Path $sdkZip -DestinationPath $sdkTmp -Force

        # SteamworksSDKCI extracts to <root>/SteamworksSDKCI-<tag>/steamworks_sdk
        $inner = Get-ChildItem $sdkTmp -Directory | Select-Object -First 1
        if (-not $inner) { throw "SteamworksSDKCI archive did not contain a directory" }
        $src = Join-Path $inner.FullName "steamworks_sdk"
        if (-not (Test-Path $src)) { throw "steamworks_sdk folder not found in archive" }

        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item -Recurse -Force "$src/*" $dest

        if (-not (Test-Path (Join-Path $dest "redistributable_bin/steam_api.lib"))) {
          throw "steam_api.lib missing after SDK copy"
        }
        Write-Host "Steamworks SDK installed to $dest"

    - name: Cache FetchContent deps
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/_deps
        key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Configure
      run: |
        mkdir ${{ github.workspace }}/release
        cmake -G Ninja -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -S ${{ github.workspace }} -DOUTDIR=${{ github.workspace }}/release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --target csgo srcds csgo_gc --parallel

    - name: Show sccache stats
      if: always()
      shell: bash
      run: |
        if command -v sccache >/dev/null 2>&1; then
          sccache --show-stats
        else
          echo "sccache is not available"
        fi

    - name: Package
      shell: bash
      run: |
        cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/release/
        mkdir $GITHUB_WORKSPACE/release/licenses
        cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-csgo_gc.txt
        cp $GITHUB_WORKSPACE/build/_deps/cryptopp-cmake-build/cryptopp/License.txt $GITHUB_WORKSPACE/release/licenses/LICENSE-crypto++.txt
        cp $GITHUB_WORKSPACE/build/_deps/distorm-src/COPYING $GITHUB_WORKSPACE/release/licenses/LICENSE-distorm.txt
        cp $GITHUB_WORKSPACE/build/_deps/funchook-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-funchook.txt
        cp $GITHUB_WORKSPACE/build/_deps/protobuf-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-protobuf.txt
        cp $GITHUB_WORKSPACE/examples/config.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/config_en.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/inventory.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/price_sheet.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/unusual_loot_lists.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/passes.txt $GITHUB_WORKSPACE/release/csgo_gc/

    - name: Zip artifacts
      shell: pwsh
      env:
        OUTNAME: csgo_gc-windows-latest.zip
      run: |
        $out = Join-Path $env:GITHUB_WORKSPACE $env:OUTNAME
        if (Test-Path $out) { Remove-Item $out -Force }
        Set-Location (Join-Path $env:GITHUB_WORKSPACE 'release')
        7z a -tzip $out *
        Get-ChildItem $out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-windows-latest
        path: ${{ github.workspace }}/csgo_gc-windows-latest.zip

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=continuous
          files=( $(find artifacts -type f -name "*.zip") )

          if [ ${#files[@]} -gt 0 ]; then
            gh release delete "$TAG" --cleanup-tag --repo "$REPO" --yes || true
            sleep 10s
            gh release create "$TAG" --repo "$REPO" \
              --title "Continuous Build" \
              --notes "$SHA" \
              --target "$SHA"
            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
          fi
